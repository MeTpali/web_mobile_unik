# Два backend версии blue. nginx завершает TLS и выбирает backend. HTTP-запросы могут попасть на
# разные экземпляры; WSS остаётся у одного процесса до разрыва.
# Именованная группа backend для балансировки.
upstream expenses_backend {
    # Адрес одного backend на этом ПК. max_fails/fail_timeout ограничивают использование отказавшего
    # экземпляра.
    server 127.0.0.1:9101 max_fails=1 fail_timeout=3s;
    # Адрес одного backend на этом ПК. max_fails/fail_timeout ограничивают использование отказавшего
    # экземпляра.
    server 127.0.0.1:9102 max_fails=1 fail_timeout=3s;
}
