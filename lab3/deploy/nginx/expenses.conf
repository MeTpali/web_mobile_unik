# HTTPS, балансировщик, заголовки и WSS-проксирование. nginx завершает TLS и выбирает backend.
# HTTP-запросы могут попасть на разные экземпляры; WSS остаётся у одного процесса до разрыва.

include /etc/nginx/expenses-lab/active.conf;
# Переменная nginx зависит от заголовка: обычный HTTP и WebSocket используют разные значения
# Connection.
map $http_upgrade $expenses_connection_upgrade {
    default upgrade;
    '' close;
}
log_format expenses_lab '$time_iso8601 $request_method $uri status=$status '
                        'upstream=$upstream_addr backend=$upstream_http_x_backend_id '
                        'version=$upstream_http_x_app_version';

server {
    # Внешний порт nginx. ssl завершает TLS здесь, внутренний backend использует локальный HTTP.
    listen 9443 ssl;
    server_name _;
    # Публичный сертификат, предъявляемый клиенту при TLS-рукопожатии.
    ssl_certificate /etc/expenses-lab/server.crt;
    # Путь к приватному ключу сервера: не передаётся телефону.
    ssl_certificate_key /etc/expenses-lab/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log /var/log/nginx/expenses-lab.log expenses_lab;

    # Правила URL-префикса выбирают backend и параметры проксирования.
    location / {
        # Передаём запрос в выбранный upstream за общим адресом nginx.
        proxy_pass http://expenses_backend;
        proxy_http_version 1.1;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header Host $http_host;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header X-Real-IP $remote_addr;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header X-Forwarded-Proto https;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header Upgrade $http_upgrade;
        # Передаём заголовок backend. Upgrade/Connection обеспечивают WebSocket-переход, Host сохраняет
        # внешний адрес.
        proxy_set_header Connection $expenses_connection_upgrade;
        proxy_connect_timeout 1s;
        # Предел ожидания backend. WSS heartbeat должен приходить чаще этого интервала.
        proxy_read_timeout 45s;
        proxy_send_timeout 10s;
        proxy_buffering off;

        # Условия перехода к другому backend. Неидемпотентную операцию нельзя безусловно повторять после
        # отправки.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Условия перехода к другому backend. Неидемпотентную операцию нельзя безусловно повторять после
        # отправки.
        proxy_next_upstream_tries 2;
    }
}
