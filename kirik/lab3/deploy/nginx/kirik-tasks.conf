# Файл включается в http-контекст штатного nginx Ubuntu.
include /etc/nginx/kirik-tasks/active.conf;
map $http_upgrade $tasks_connection_upgrade {
    default upgrade;
    '' close;
}
log_format kirik_tasks '$time_iso8601 $request_method $uri status=$status '
                        'upstream=$upstream_addr backend=$upstream_http_x_backend_id '
                        'version=$upstream_http_x_app_version';

server {
    listen 9543 ssl;
    server_name _;
    ssl_certificate /etc/kirik-tasks/server.crt;
    ssl_certificate_key /etc/kirik-tasks/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log /var/log/nginx/kirik-tasks.log kirik_tasks;

    location / {
        proxy_pass http://tasks_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tasks_connection_upgrade;
        proxy_connect_timeout 1s;
        proxy_read_timeout 45s;
        proxy_send_timeout 10s;
        proxy_buffering off;
        # nginx не повторяет уже отправленные POST/PATCH как non_idempotent.
        # Неопределённый исход мутации обрабатывает очередь клиента с прежним ключом.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
