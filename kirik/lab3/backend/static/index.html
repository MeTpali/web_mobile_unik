<!-- Браузерный интерфейс. HTML задаёт структуру и доступные подписи. id связывает элемент с JavaScript, class — с CSS. Данные приходят через отдельный сетевой скрипт. -->
<!doctype html>
<html lang="ru">
<head>
  <!-- Метаданные: UTF-8 обеспечивает русский текст, viewport согласует CSS-ширину с мобильным экраном. -->
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт задач — REST API</title>
  <style>
* {
    /* border-box включает padding и border в указанную width: поля не вылезают из доступной ширины. */
    box-sizing:border-box
}
body {
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:0;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#f5f7fb;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#192e45;
    /* Сокращённая запись параметров шрифта: размер, при наличии line-height, семейство. */
    font:16px/1.5 sans-serif
}
.shell {
    /* Ограничивает растяжение на широком экране, сохраняя адаптивность на узком. */
    max-width:1280px;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:auto;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:30px 22px
}
.masthead {
    /* Нижняя линия отделяет заголовок или блок от следующей группы. */
    border-bottom:2px solid #192e45;
    margin-bottom:26px;
    padding-bottom:24px;
    /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
    display:flex;
    /* Распределение свободного места вдоль основной оси раскладки. */
    justify-content:space-between;
    /* Расстояние между flex/grid-элементами без отдельных margin на каждом дочернем блоке. */
    gap:24px;
    /* Выравнивание дочерних элементов поперёк основной оси flex/grid. */
    align-items:center
}
.eyebrow {
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:12px;
    /* Расстояние между буквами, используемое для коротких служебных подписей. */
    letter-spacing:3px;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#52677f
}
h1 {
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:42px;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:8px 0
}
.board {
    /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
    display:grid;
    /* Задаёт колонки сетки. minmax/доли позволяют перераспределять ширину без фиксированного макета. */
    grid-template-columns:minmax(0,1fr) 340px;
    /* Расстояние между flex/grid-элементами без отдельных margin на каждом дочернем блоке. */
    gap:24px
}
.task-list {
    /* Определяет колонку блока в сетке рабочего стола. */
    grid-column:1;
    /* Определяет положение/охват строк сетки; span позволяет списку занять высоту нескольких боковых блоков. */
    grid-row:1 / span 3
}
.editor,.account,.response {
    /* Определяет колонку блока в сетке рабочего стола. */
    grid-column:2
}
li h3 {
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:12px 0 6px;
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:23px
}
li p {
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:6px 0;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#52677f
}
.task-state {
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:12px;
    /* Скругление углов карточки/кнопки, не меняющее область данных. */
    border-radius:20px;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#dfe9fb;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#24477e;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:5px 12px
}
section {
    margin-bottom:24px;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:white;
    /* Рамка: толщина, стиль и цвет. Влияет на геометрию с учётом box-sizing. */
    border:1px solid #dde4ee;
    /* Скругление углов карточки/кнопки, не меняющее область данных. */
    border-radius:16px;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:24px;
    /* Нижний предел ширины. Значение 0 разрешает flex/grid-элементу сжиматься и переносить содержимое. */
    min-width:0
}
h2 {
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:21px;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:0 0 20px
}
label {
    /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
    display:block;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:14px 0;
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:14px;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#40556f
}
input,textarea,select,button {
    /* Сокращённая запись параметров шрифта: размер, при наличии line-height, семейство. */
    font:inherit;
    /* Ограничивает растяжение на широком экране, сохраняя адаптивность на узком. */
    max-width:100%;
    /* Скругление углов карточки/кнопки, не меняющее область данных. */
    border-radius:8px;
    /* Минимальная высота сохраняет удобную область нажатия или место результата до загрузки. */
    min-height:44px
}
input,textarea,select {
    /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
    display:block;
    /* Ширина элемента: проценты относятся к содержащему блоку, не к физическим пикселям устройства. */
    width:100%;
    /* Рамка: толщина, стиль и цвет. Влияет на геометрию с учётом box-sizing. */
    border:1px solid #bac8db;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:10px;
    margin-top:6px;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#f9fbff;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#192e45
}
textarea {
    /* Минимальная высота сохраняет удобную область нажатия или место результата до загрузки. */
    min-height:90px;
    /* Ограничивает ручное изменение размеров textarea, чтобы не разрушать ширину формы. */
    resize:vertical
}
button {
    /* Вид курсора подсказывает действие пользователю мыши; не заменяет семантическую кнопку. */
    cursor:pointer;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:10px 16px;
    /* Рамка: толщина, стиль и цвет. Влияет на геометрию с учётом box-sizing. */
    border:0;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#2458b7;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:white;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:4px 8px 4px 0
}
button[type=button] {
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#eaf0fa;
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#24477e
}
button:disabled {
    /* Прозрачность визуально обозначает, например, disabled. Реальная блокировка задаётся атрибутом/обработчиком. */
    opacity:.5
}
input:focus,select:focus,textarea:focus,button:focus {
    /* Видимый индикатор клавиатурного фокуса. Не занимает места в раскладке. */
    outline:3px solid #c08927;
    /* Отодвигает фокусную обводку от рамки, чтобы она оставалась заметной. */
    outline-offset:2px
}
ul {
    /* Управляет маркерами списка; при карточках стандартные точки обычно скрываются. */
    list-style:none;
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:0
}
li {
    /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
    padding:20px;
    margin-top:14px;
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#f7f9fe;
    /* Боковая рамка выделяет результат/карточку и сохраняет визуальную группировку. */
    border-left:4px solid #4678cb;
    /* Скругление углов карточки/кнопки, не меняющее область данных. */
    border-radius:0 12px 12px 0;
    /* Разрешает перенос длинного URL/числа без пробелов, предотвращая горизонтальный выход за карточку. */
    overflow-wrap:anywhere
}
li button {
    margin-top:12px
}
pre {
    /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
    font-size:13px;
    /* Определяет сохранение пробелов/переводов строк. pre-wrap сохраняет диагностику и разрешает перенос. */
    white-space:pre-wrap;
    /* Разрешает перенос длинного URL/числа без пробелов, предотвращая горизонтальный выход за карточку. */
    overflow-wrap:anywhere;
    /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
    margin:0
}
.response {
    /* Фон элемента. Фон и цвет текста подбираются совместно для читаемого контраста. */
    background:#edf2fa
}
a {
    /* Цвет текста/наследуемого foreground. Сам цвет не должен быть единственным обозначением состояния. */
    color:#2458b7
}
@media(max-width:850px) {
    .board {
        /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
        display:flex;
        /* Выбирает направление flex: row — рядом, column — друг под другом. */
        flex-direction:column
    }
    .account {
        /* Меняет визуальный порядок flex-элементов на узком экране; DOM-порядок и обработчики остаются прежними. */
        order:0
    }
    .task-list {
        /* Меняет визуальный порядок flex-элементов на узком экране; DOM-порядок и обработчики остаются прежними. */
        order:1
    }
    .editor {
        /* Меняет визуальный порядок flex-элементов на узком экране; DOM-порядок и обработчики остаются прежними. */
        order:2
    }
    .response {
        /* Меняет визуальный порядок flex-элементов на узком экране; DOM-порядок и обработчики остаются прежними. */
        order:3
    }
    .masthead {
        /* Выбирает модель раскладки: block, flex, grid или скрытие none. */
        display:block
    }
    h1 {
        /* Размер текста. Не отключаем масштабирование страницы ради фиксированной раскладки. */
        font-size:34px
    }
}
@media(max-width:420px) {
    .shell {
        /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
        padding:20px 12px
    }
    section {
        /* Внутреннее пространство между рамкой и содержимым. Четыре значения задают верх/право/низ/лево, два — вертикаль/горизонталь. */
        padding:18px
    }
    button {
        /* Ширина элемента: проценты относятся к содержащему блоку, не к физическим пикселям устройства. */
        width:100%;
        /* Внешнее расстояние от элемента до соседей. auto по горизонтали центрирует блок с ограниченной шириной. */
        margin:6px 0
    }
}
  </style>
</head>
<body>
  <main class="shell">
  <header class="masthead"><div><div class="eyebrow">KIRIK / ЛАБОРАТОРНАЯ 03</div><h1>Рабочая доска</h1><p>Планируйте задачи и следите за их выполнением.</p></div><a href="/docs">Документация API →</a></header>
  <div class="board">
  <!-- Смысловая область формы/списка/результата; class задаёт её положение через CSS. -->
  <section class="account">
    <h2>Учётная запись</h2>
    <!-- Группа полей. JavaScript перехватывает submit по id, сохраняя страницу без перезагрузки. -->
    <form id="login"><label>Пользователь<input id="username" value="demo" required autocomplete="username"></label>
      <!-- Подпись объясняет ввод; вложенный input связывается с ней без отдельного for. -->
      <label>Пароль<input id="password" type="password" required autocomplete="current-password"></label>
      <!-- Кнопка формы по умолчанию отправляет submit. Для вспомогательных действий нужен type=button. -->
      <button>Войти</button><button type="button" id="logout">Выйти</button></form>
  </section>
  <!-- Смысловая область формы/списка/результата; class задаёт её положение через CSS. -->
  <section class="editor">
    <h2>Карточка задачи</h2>
    <!-- Группа полей. JavaScript перехватывает submit по id, сохраняя страницу без перезагрузки. -->
    <form id="task"><input id="recordId" type="hidden"><input id="version" type="hidden">
      <!-- Подпись объясняет ввод; вложенный input связывается с ней без отдельного for. -->
      <label>Срок<input id="due_date" type="date" required></label>
      <!-- Подпись объясняет ввод; вложенный input связывается с ней без отдельного for. -->
      <label>Заголовок<input id="title" maxlength="160" required></label>
      <!-- Подпись объясняет ввод; вложенный input связывается с ней без отдельного for. -->
      <label>Статус<select id="state"><option value="todo">К выполнению</option><option value="doing">В работе</option><option value="done">Готово</option></select></label>
      <!-- Подпись объясняет ввод; вложенный input связывается с ней без отдельного for. -->
      <label>Описание<textarea id="description" maxlength="2000"></textarea></label>
      <!-- Кнопка формы по умолчанию отправляет submit. Для вспомогательных действий нужен type=button. -->
      <button>Сохранить</button><button type="button" id="reset">Очистить форму</button>
    </form>
  </section>
  <!-- Смысловая область формы/списка/результата; class задаёт её положение через CSS. -->
  <section class="task-list"><div class="eyebrow">МОЙ ПЛАН</div><h2>Задачи</h2><button id="refresh">Обновить список</button><ul id="list"></ul></section>
  <!-- Смысловая область формы/списка/результата; class задаёт её положение через CSS. -->
  <section class="response"><h2>Состояние запроса</h2><pre id="status" role="status">Войдите в систему.</pre></section>
  </div></main>
  <!-- JS подключён после DOM: элементы существуют к моменту регистрации обработчиков. -->
  <script src="/browser.js"></script>
</body></html>
