<!-- HTML-оболочка: кодировка UTF-8, русский язык, viewport для мобильного экрана и контейнер для React. HTML задаёт структуру и доступные подписи. id связывает элемент с JavaScript, class — с CSS. Данные приходят через отдельный сетевой скрипт. -->
<!doctype html>
<!-- HTML-оболочка страницы. doctype включает стандартный режим отображения.
     lang помогает браузеру и экранному диктору правильно обрабатывать русский текст. -->
<html lang="ru">

<head>
    <!-- UTF-8 обеспечивает корректную кириллицу; viewport задаёт мобильную
         ширину в CSS-пикселях, чтобы @media работали по реальному размеру экрана. -->
    <!-- Метаданные: UTF-8 обеспечивает русский текст, viewport согласует CSS-ширину с мобильным экраном. -->
    <meta charset="UTF-8" />
  <!-- Метаданные: UTF-8 обеспечивает русский текст, viewport согласует CSS-ширину с мобильным экраном. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Заголовок вкладки, не заменяющий h1 внутри React-компонента. -->
    <title>Генератор случайных чисел</title>
</head>

<body>
    <!-- Контейнер изначально пуст: main.jsx монтирует в него App.
         Это клиентская отрисовка, а не серверная генерация HTML-интерфейса. -->
    <div id="root"></div>
    <!-- Модульная точка входа. JSX обрабатывает Vite: браузер не читает JSX напрямую.
         При build Vite заменит ссылку ссылкой на собранный JS в dist/assets. -->
  <!-- JS подключён после DOM: элементы существуют к моменту регистрации обработчиков. -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
